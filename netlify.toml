[build]
  # TEMPORARY: intentional failure to inspect Netlify's failed-build UI. Revert me.
  command = "echo 'Intentional build failure (testing Netlify failure UI)' && exit 1"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/conference-2025"
  to = "/"
  status = 301

[[redirects]]
  from = "/register"
  to = "https://lu.ma/sfruby"
  status = 301

[[redirects]]
  from = "/talks"
  to = "/videos"
  status = 301

[[redirects]]
  from = "/talks/*"
  to = "/videos/:splat"
  status = 301

[[redirects]]
  from = "/speakers"
  to = "/videos"
  status = 301

[[redirects]]
  from = "/schedule"
  to = "/videos"
  status = 301

[[redirects]]
  from = "/sponsors"
  to = "/sponsor-2026"
  status = 301

[[redirects]]
  from = "/startup-demos"
  to = "/startups"
  status = 301

# Retired monthly issue archive pages now point at the running feed
[[redirects]]
  from = "/news/2026-*"
  to = "/news"
  status = 301

# SPA fallback for 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers for all pages (except presentation which needs iframes)
[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deny framing for most pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"

# Allow same-origin framing for presentation (presenter view uses iframes)
[[headers]]
  for = "/rubyconfth/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

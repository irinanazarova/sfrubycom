[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/conference-2025"
  to = "/"
  status = 301

# The conference is the homepage now; the old page 301s home
[[redirects]]
  from = "/conference-2026"
  to = "/"
  status = 301

[[redirects]]
  from = "/register"
  to = "https://lu.ma/sfruby"
  status = 301

[[redirects]]
  from = "/talks"
  to = "/videos"
  status = 301

[[redirects]]
  from = "/talks/*"
  to = "/videos/:splat"
  status = 301

[[redirects]]
  from = "/schedule"
  to = "/videos"
  status = 301

[[redirects]]
  from = "/sponsors"
  to = "/sponsor-2026"
  status = 301

[[redirects]]
  from = "/startup-demos"
  to = "/startups"
  status = 301

# Same-origin proxy for the CFP talks feed: no CORS involvement, the CFP app's
# location stays swappable, and the edge caches responses (the API sends
# Cache-Control: public, max-age=600, stale-while-revalidate=3600).
[[redirects]]
  from = "/api/talks"
  to = "https://cfp.sfruby.com/api/talks"
  status = 200
  force = true

# Retired monthly issue archive pages now point at the running feed
[[redirects]]
  from = "/news/2026-*"
  to = "/news"
  status = 301

# SPA fallback for 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security headers for all pages (except presentation which needs iframes)
[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Deny framing for most pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"

# Allow same-origin framing for presentation (presenter view uses iframes)
[[headers]]
  for = "/rubyconfth/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

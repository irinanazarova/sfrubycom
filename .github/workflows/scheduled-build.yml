name: Daily Data Refresh

on:
  schedule:
    # 13:07 UTC (6am PT). An off-the-hour minute on purpose: :00 is the
    # busiest slot on GitHub's scheduler and runs there queue the longest.
    - cron: '7 13 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Ask Netlify to rebuild, rather than building here and uploading the
      # result. The build needs LUMA_API_KEY and LUMA_CALENDAR_ID, and those
      # already live in the Netlify project; keeping one copy of them is the
      # whole point. The previous version of this job built and deployed from
      # the runner using GitHub secrets that were never set, so every run from
      # at least 2026-07-12 to 2026-09-30 fetched nothing, kept the committed
      # snapshot, and then failed waiting on an interactive Netlify login.
      #
      # What this refreshes: the Luma meetup events, the CFP talks, and the
      # "Ruby companies attending" snapshot on the homepage, none of which
      # update in the browser (see CLAUDE.md).
      - name: Trigger a Netlify production build
        run: |
          curl --fail --silent --show-error --max-time 30 \
            -X POST -d '{}' "$BUILD_HOOK"
        env:
          BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}

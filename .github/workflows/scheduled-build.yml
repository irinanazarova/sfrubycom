name: Weekly Build & Deploy

on:
  schedule:
    - cron: '0 1 * * 0' # Sundays 1 AM UTC
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SHEET_STARTUPS_CSV_URL: ${{ secrets.SHEET_STARTUPS_CSV_URL }}
          SHEET_JOBS_CSV_URL: ${{ secrets.SHEET_JOBS_CSV_URL }}
          SHEET_NEWS_CSV_URL: ${{ secrets.SHEET_NEWS_CSV_URL }}
          SHEET_TALKS_CSV_URL: ${{ secrets.SHEET_TALKS_CSV_URL }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          LUMA_CALENDAR_ID: ${{ secrets.LUMA_CALENDAR_ID }}
        run: npm run build

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --prod --dir=dist
